services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 12

  wordpress:
    image: wordpress:6.9-php8.2-apache
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/hv-wordpress-entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8888:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', true);
        define('SCRIPT_DEBUG', true);
        define('AI1WM_MAX_FILE_SIZE', 3221225472);
    volumes:
      - wp_data:/var/www/html
      - ./:/var/www/html/wp-content/themes/hands-and-vision
      - ./backups:/var/www/html/wp-content/ai1wm-backups
      - ./docker/php-uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - ./docker/apache-uploads.conf:/etc/apache2/conf-enabled/hv-uploads.conf:ro
      - ./docker/wordpress-entrypoint.sh:/usr/local/bin/hv-wordpress-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/wp-config.php"]
      interval: 5s
      timeout: 5s
      retries: 24

  wpcli:
    image: wordpress:cli-php8.2
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
      - ./:/var/www/html/wp-content/themes/hands-and-vision
      - ./backups:/var/www/html/wp-content/ai1wm-backups
      - ./docker/php-uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    working_dir: /var/www/html
    profiles:
      - tools

volumes:
  wp_data:
  db_data:
